<!-- ============================ -->
<!-- MEDIA PAGE (hidden by default) -->
<!-- ============================ -->
<section class="content-area" id="mediaContent" style="display:none;">
    <!-- Header -->
    <div class="media-header">
        <div class="media-header-left">
            <h2>Media</h2>
            <p>Manage your photos, videos and portfolio assets.</p>
        </div>
        <button class="btn-primary" id="uploadMediaBtn">
            <i class="fas fa-plus"></i> Upload Media
        </button>
    </div>

    <!-- Toolbar -->
    <div class="media-toolbar">
        <div class="media-search">
            <i class="fas fa-search"></i>
            <input type="text" id="mediaSearch" placeholder="Search media..." />
        </div>
        <div class="media-filters">
            <button class="filter-btn active" data-filter="all">All Media</button>
            <button class="filter-btn" data-filter="images">Images</button>
            <button class="filter-btn" data-filter="videos">Videos</button>
            <button class="filter-btn" data-filter="unassigned">Unassigned</button>
            <button class="filter-btn" data-filter="used">Used in Projects</button>
            <button class="filter-btn" data-filter="unused">Unused</button>
        </div>
        <div class="media-sort">
            <select id="mediaSort">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="name_asc">Name A–Z</option>
                <option value="name_desc">Name Z–A</option>
                <option value="largest">Largest</option>
                <option value="smallest">Smallest</option>
                <option value="updated">Recently Updated</option>
            </select>
        </div>
    </div>

    <!-- Stats Summary -->
    <div class="media-stats" id="mediaStats">
        <!-- populated by JavaScript -->
    </div>

    <!-- Media Grid -->
    <div class="media-grid" id="mediaGrid">
        <!-- populated by JavaScript -->
    </div>

    <!-- Pagination (if needed) -->
    <div class="media-pagination" id="mediaPagination"></div>
</section>
