<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Crevio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .login-page { width: 100%; max-width: 400px; padding: 20px; }
        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: var(--shadow-glass);
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.05em; color: var(--brand-color); margin: 0; }
        .brand p { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 4px 0 0; }
        .login-heading { margin-bottom: 28px; }
        .login-heading h2 { font-size: 22px; font-weight: 600; color: var(--text-primary); margin: 0 0 4px; letter-spacing: -0.04em; }
        .login-heading p { color: var(--text-secondary); font-size: 14px; margin: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: border 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .form-group input::placeholder { color: var(--text-muted); }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0 16px;
        }
        .checkbox-group input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #64748B;
            background: #0F172A;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin: 0;
            transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .checkbox-group input[type="checkbox"]:hover {
            border-color: #94A3B8;
        }
        .checkbox-group input[type="checkbox"]:checked {
            background: #2563EB;
            border-color: #2563EB;
        }
        .checkbox-group input[type="checkbox"]:checked:hover {
            background: #1D4ED8;
            border-color: #1D4ED8;
        }
        .checkbox-group input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 1px;
            width: 6px;
            height: 11px;
            border: solid #FFFFFF;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-group input[type="checkbox"]:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.35);
        }
        .checkbox-group input[type="checkbox"]:hover {
            border-color: #64748B;
        }
        .checkbox-group input[type="checkbox"]:checked {
            background: rgba(37,99,235,0.20);
            border-color: #2563EB;
        }
        .checkbox-group input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 0px;
            width: 6px;
            height: 11px;
            border: solid #60A5FA;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-group input[type="checkbox"]:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
        }
        .checkbox-group input[type="checkbox"]:hover {
            border-color: var(--accent);
        }
        .checkbox-group input[type="checkbox"]:checked {
            background: var(--accent-dim);
            border-color: var(--accent);
        }
        .checkbox-group input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 0px;
            width: 6px;
            height: 11px;
            border: solid var(--accent);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-group input[type="checkbox"]:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .checkbox-group label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .login-message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .login-message.show { display: block; }
        .login-message.success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.2);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 4px;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:disabled { opacity: 0.6; transform: none; box-shadow: none; }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: 1px solid var(--border-glass);
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-secondary:hover { background: var(--bg-glass); color: var(--text-primary); }
        #twoFactorSection { display: none; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .brand h1 { font-size: 24px; }
        }
            /* PASSWORD VISIBILITY TOGGLE */
        .pwd-toggle-wrap { position: relative; display: block; width: 100%; }
        .pwd-toggle-wrap input { width: 100%; padding-right: 44px !important; }
        .pwd-toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted, #64748B);
            width: 32px; height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
            transition: background 0.12s, color 0.12s;
            z-index: 5;
        }
        .pwd-toggle-btn:hover { background: rgba(148,163,184,0.15); color: var(--text-primary, #F1F5F9); }
        .pwd-toggle-btn svg { width: 16px; height: 16px; }
</style>

<style id="crevio-checkbox-final">
/* Final override — wins against every previous rule */
.checkbox-group input[type="checkbox"] {
    appearance: none !important;
    -webkit-appearance: none !important;
    -moz-appearance: none !important;
    display: inline-block !important;
    width: 20px !important;
    height: 20px !important;
    min-width: 20px !important;
    border-radius: 6px !important;
    border: 2px solid #64748B !important;
    background-color: #0F172A !important;
    cursor: pointer !important;
    position: relative !important;
    flex-shrink: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
    vertical-align: middle !important;
    transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease !important;
}

.checkbox-group input[type="checkbox"]:hover:not(:checked) {
    border-color: #94A3B8 !important;
}

.checkbox-group input[type="checkbox"]:checked {
    background-color: #2563EB !important;
    border-color: #2563EB !important;
}

.checkbox-group input[type="checkbox"]:checked:hover {
    background-color: #1D4ED8 !important;
    border-color: #1D4ED8 !important;
}

.checkbox-group input[type="checkbox"]:checked::after {
    content: "" !important;
    position: absolute !important;
    left: 6px !important;
    top: 1px !important;
    width: 5px !important;
    height: 11px !important;
    border: solid #FFFFFF !important;
    border-width: 0 2px 2px 0 !important;
    transform: rotate(45deg) !important;
    display: block !important;
}

.checkbox-group input[type="checkbox"]:focus-visible {
    outline: none !important;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.35) !important;
}
</style>
</head>
<body>

<div class="login-page">
    <div class="login-card glass">

        <div class="brand">
            <h1>Crevio</h1>
            <p>Admin Portal</p>
        </div>

        <!-- Step 1: Email / Password -->
        <div id="loginStep1">
            <div class="login-heading">
                <h2>Welcome back</h2>
                <p>Sign in to manage your portfolio.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" value="joseph_test@crevio.test" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <!-- Remember This Device -->
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberDevice" name="remember_device" value="true">
                    <label for="rememberDevice">Remember this device for 30 days</label>
                </div>

                <div id="loginMessage" class="login-message"></div>
                <button type="submit" class="btn-primary" id="loginButton">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="#">Forgot password?</a>
            </div>
        </div>

        <!-- Step 2: 2FA TOTP -->
        <div id="twoFactorSection">
            <div class="login-heading">
                <h2>TwoFactor Authentication</h2>
                <p>Enter the 6digit code from your authenticator app</p>
            </div>
            <div class="form-group">
                <label for="twoFactorCode">Authenticator Code</label>
                <input type="text" id="twoFactorCode" placeholder="e.g. 123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberDevice2fa" name="remember_device_2fa" value="true">
                <label for="rememberDevice2fa">Remember this device</label>
            </div>
            <div id="twoFactorMessage" class="login-message"></div>
            <button class="btn-primary" id="verifyButton">Verify</button>
            <button class="btn-secondary" id="cancel2faButton"> Back to login</button>
        </div>

    </div>
</div>

<script src="../js/login.js"></script>
    <script>
    // =========================================================
    // PASSWORD VISIBILITY TOGGLE
    // Auto-detects every <input type="password"> and adds an eye button.
    // =========================================================
    (function () {
        if (window.pwdVisibilityToggle) return;
        window.pwdVisibilityToggle = true;

        function makeIcon(name) {
            // Use lucide if available, otherwise inline SVG
            if (typeof lucide !== "undefined") {
                const el = document.createElement("i");
                el.setAttribute("data-lucide", name);
                el.style.width = "16px";
                el.style.height = "16px";
                return el;
            }
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            svg.setAttribute("fill", "none");
            svg.setAttribute("stroke", "currentColor");
            svg.setAttribute("stroke-width", "2");
            svg.setAttribute("stroke-linecap", "round");
            svg.setAttribute("stroke-linejoin", "round");
            if (name === "eye") {
                svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            } else {
                svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            }
            return svg;
        }

        function wrap(input) {
            if (input.dataset.pwdWrapped === "1") return;
            input.dataset.pwdWrapped = "1";

            // Already wrapped by a parent? Skip.
            if (input.parentElement && input.parentElement.classList.contains("pwd-toggle-wrap")) return;

            // Create wrapper
            const wrap = document.createElement("div");
            wrap.className = "pwd-toggle-wrap";
            input.parentNode.insertBefore(wrap, input);
            wrap.appendChild(input);

            // Create button
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "pwd-toggle-btn";
            btn.setAttribute("aria-label", "Show password");
            btn.setAttribute("title", "Show password");
            btn.appendChild(makeIcon("eye"));
            wrap.appendChild(btn);

            // Refresh icons AFTER appending to DOM
            if (typeof lucide !== "undefined") {
                try { lucide.createIcons(); } catch (e) {}
            }

            let visible = false;
            btn.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                visible = !visible;
                input.type = visible ? "text" : "password";
                btn.innerHTML = "";
                btn.appendChild(makeIcon(visible ? "eye-off" : "eye"));
                btn.setAttribute("aria-label", visible ? "Hide password" : "Show password");
                btn.setAttribute("title", visible ? "Hide password" : "Show password");
                if (typeof lucide !== "undefined") {
                    try { lucide.createIcons(); } catch (e) {}
                }
                // Keep focus in the input so the user keeps typing
                input.focus();
                try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
            });
        }

        function scan() {
            document.querySelectorAll('input[type="password"]').forEach(wrap);
        }

        // Initial scan
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => setTimeout(scan, 100));
        } else {
            setTimeout(scan, 100);
        }

        // Rescan when DOM changes (in case the form is dynamic)
        if (window.MutationObserver) {
            new MutationObserver(() => {
                clearTimeout(window.__pwdScanT);
                window.__pwdScanT = setTimeout(scan, 200);
            }).observe(document.body, { childList: true, subtree: true });
        }

        // Also rescan on window load in case lucide icons load late
        window.addEventListener("load", () => setTimeout(scan, 300));
    })();
    </script>
