<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Crevio Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .login-page { width: 100%; max-width: 400px; padding: 20px; }
        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: var(--shadow-glass);
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.05em; color: var(--brand-color); margin: 0; }
        .brand p { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 4px 0 0; }
        .login-heading { margin-bottom: 28px; }
        .login-heading h2 { font-size: 22px; font-weight: 600; color: var(--text-primary); margin: 0 0 4px; letter-spacing: -0.04em; }
        .login-heading p { color: var(--text-secondary); font-size: 14px; margin: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: border 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .form-group input::placeholder { color: var(--text-muted); }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0 16px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .login-message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .login-message.show { display: block; }
        .login-message.success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.2);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 4px;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:disabled { opacity: 0.6; transform: none; box-shadow: none; }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: 1px solid var(--border-glass);
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-secondary:hover { background: var(--bg-glass); color: var(--text-primary); }
        #twoFactorSection { display: none; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .brand h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-card glass">

        <div class="brand">
            <h1>Crevio</h1>
            <p>Admin Portal</p>
        </div>

        <!-- Step 1: Email / Password -->
        <div id="loginStep1">
            <div class="login-heading">
                <h2>Welcome back</h2>
                <p>Sign in to manage your portfolio.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" value="joseph_test@crevio.test" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <!-- Remember This Device -->
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberDevice" name="remember_device" value="true">
                    <label for="rememberDevice">Remember this device for 30 days</label>
                </div>

                <div id="loginMessage" class="login-message"></div>
                <button type="submit" class="btn-primary" id="loginButton">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="#">Forgot password?</a>
            </div>
        </div>

        <!-- Step 2: 2FA TOTP -->
        <div id="twoFactorSection">
            <div class="login-heading">
                <h2>Two‑Factor Authentication</h2>
                <p>Enter the 6‑digit code from your authenticator app</p>
            </div>
            <div class="form-group">
                <label for="twoFactorCode">Authenticator Code</label>
                <input type="text" id="twoFactorCode" placeholder="e.g. 123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberDevice2fa" name="remember_device_2fa" value="true">
                <label for="rememberDevice2fa">Remember this device</label>
            </div>
            <div id="twoFactorMessage" class="login-message"></div>
            <button class="btn-primary" id="verifyButton">Verify</button>
            <button class="btn-secondary" id="cancel2faButton">← Back to login</button>
        </div>

    </div>
</div>

<script src="../js/login.js"></script>
</body>
</html>
