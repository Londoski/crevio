<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crevio — Portfolio Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0F172A;
            color: #F1F5F9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { text-align: center; max-width: 500px; }
        h1 {
            font-size: 56px;
            font-weight: 800;
            color: #2563EB;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
        }
        .tagline {
            font-size: 18px;
            color: #94A3B8;
            margin-bottom: 40px;
        }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: #2563EB;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            color: #94A3B8;
            border: 1px solid #334155;
        }
        .btn-secondary:hover {
            background: #1E293B;
            color: #F1F5F9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crevio</h1>
        <p class="tagline">Build your portfolio. Showcase your work.</p>
        <div class="actions">
            <a href="/dashboard/" class="btn btn-primary">Go to Dashboard →</a>
            <a href="/admin/pages/login.html" class="btn btn-secondary">Sign In</a>
        </div>
    </div>
</body>
</html>
