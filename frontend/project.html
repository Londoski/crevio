<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Crevio project"
        id="project-meta-description"
    >

    <title>Project | Crevio</title>

    <link
        rel="stylesheet"
        href="/css/main.css"
    >

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="site-header">

        <nav class="navbar">

            <a
                href="/"
                class="brand"
                aria-label="Crevio home"
            >
                CREVIO
            </a>


            <div class="nav-links">

                <a href="/">
                    Work
                </a>

                <a href="/#about">
                    About
                </a>

                <a href="/#contact">
                    Contact
                </a>

            </div>

        </nav>

    </header>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main>

        <section class="project-page">

            <div class="project-shell">


                <!-- ==================================
                     BACK
                =================================== -->

                <div class="project-back">

                    <a href="/">
                        ← Back to work
                    </a>

                </div>



                <!-- ==================================
                     PROJECT HEADER
                =================================== -->

                <header
                    id="project-header"
                    class="project-detail-header"
                >

                    <p
                        id="project-category"
                        class="eyebrow"
                    >
                        Loading...
                    </p>


                    <h1 id="project-title">
                        Loading project...
                    </h1>


                    <div
                        id="project-meta"
                        class="project-detail-meta"
                    >
                    </div>

                </header>



                <!-- ==================================
                     DESCRIPTION
                =================================== -->

                <div class="project-description-wrap">

                    <div
                        id="project-description"
                        class="project-detail-description"
                    >
                    </div>

                </div>



                <!-- ==================================
                     MEDIA
                =================================== -->

                <section
                    id="project-media"
                    class="project-detail-media"
                >

                    <div class="loading-state">
                        Loading project media...
                    </div>

                </section>



                <!-- ==================================
                     PROJECT NAVIGATION
                =================================== -->

                <nav
                    id="project-navigation"
                    class="project-navigation"
                    aria-label="Project navigation"
                >

                    <a
                        id="previous-project"
                        class="project-nav-link"
                        href="#"
                    >

                        <span class="project-nav-label">
                            Previous
                        </span>


                        <span
                            id="previous-project-title"
                            class="project-nav-title"
                        >
                        </span>

                    </a>


                    <a
                        id="next-project"
                        class="project-nav-link project-nav-next"
                        href="#"
                    >

                        <span class="project-nav-label">
                            Next
                        </span>


                        <span
                            id="next-project-title"
                            class="project-nav-title"
                        >
                        </span>

                    </a>

                </nav>

            </div>

        </section>

    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="site-footer">

        <div>
            CREVIO
        </div>


        <p>
            © <span id="current-year"></span>
            Crevio.
        </p>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="/assets/js/main.js"></script>

    <script src="/assets/js/project-detail.js"></script>


</body>

</html>
