<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Portfolio  Crevio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/dashboard/js/auth.js?v=639252892257462073"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100vh; overflow:hidden; }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); display:flex; }

        [data-theme="dark"] { --bg-primary:#0F172A; --bg-secondary:#1E293B; --bg-card:#1E293B; --bg-input:#0F172A; --border-color:#334155; --text-primary:#F1F5F9; --text-secondary:#94A3B8; --text-muted:#64748B; --accent:#2563EB; --accent-hover:#1D4ED8; --accent-dim:rgba(37,99,235,0.15); --danger:#EF4444; --success:#22C55E; --warning:#F59E0B; }
        [data-theme="light"] { --bg-primary:#F1F5F9; --bg-secondary:#FFFFFF; --bg-card:#FFFFFF; --bg-input:#F8FAFC; --border-color:#E2E8F0; --text-primary:#0F172A; --text-secondary:#475569; --text-muted:#94A3B8; --accent:#2563EB; --accent-hover:#1D4ED8; --accent-dim:rgba(37,99,235,0.1); --danger:#EF4444; --success:#22C55E; --warning:#F59E0B; }

        /* =========================================================
           LEFT  CONTROLS PANEL
           ========================================================= */
        .controls-panel {
            width: 340px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .panel-header h1 { font-size: 16px; font-weight: 700; }
        .panel-header-left  { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .panel-header-right { display: flex; align-items: center; gap: 6px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }
        .back-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        .back-btn .icon { width: 16px; height: 16px; }

        .panel-body { flex: 1; overflow-y: auto; padding: 16px; }

        .control-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .control-group-header {
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .control-group-header h3 {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group-header .icon { width: 16px; height: 16px; color: var(--accent); }
        .control-group-header .chevron { transition: transform 0.2s; color: var(--text-muted); }
        .control-group-header .chevron.open { transform: rotate(180deg); }
        .control-group-body { padding: 0 14px 14px; display: none; }
        .control-group-body.open { display: block; }

        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Section order list */
        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: grab;
        }
        .order-item:last-child { margin-bottom: 0; }
        .order-item.dragging { opacity: 0.5; }
        .order-item .drag-handle { color: var(--text-muted); }
        .order-item .icon { width: 16px; height: 16px; color: var(--accent); }
        .order-item .label { flex: 1; font-size: 13px; font-weight: 500; }
        .order-item .toggle-small { position: relative; display: inline-block; width: 32px; height: 18px; }
        .order-item .toggle-small input { opacity: 0; width: 0; height: 0; }
        .order-item .toggle-small .slider {
            position: absolute; cursor: pointer; inset: 0;
            background: var(--border-color); border-radius: 999px; transition: 0.2s;
        }
        .order-item .toggle-small .slider:before {
            content: ""; position: absolute; height: 12px; width: 12px;
            left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
        }
        .order-item .toggle-small input:checked + .slider { background: var(--accent); }
        .order-item .toggle-small input:checked + .slider:before { transform: translateX(14px); }

        .panel-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }
        .panel-footer button { flex: 1; }

        .btn-primary {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-secondary:hover { background: var(--bg-card); color: var(--text-primary); }

        /* =========================================================
           RIGHT  PREVIEW AREA
           ========================================================= */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100vh;
            position: relative;
        }

        .floating-back {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            text-decoration: none;
        }
        .floating-back:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .floating-back .icon { width: 14px; height: 14px; }

        .preview-toolbar {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 140px;
        }
        .preview-url {
            flex: 1;
            max-width: 500px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-url .icon { width: 12px; height: 12px; }
        .device-switcher {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border-radius: 6px;
            padding: 3px;
        }
        .device-switcher button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .device-switcher button.active { background: var(--accent); color: #fff; }
        .device-switcher .icon { width: 12px; height: 12px; }

        .preview-container {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .preview-frame {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 120px);
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: width 0.3s, max-width 0.3s;
            border: none;
        }
        .preview-frame.tablet { width: 768px; max-width: 100%; }
        .preview-frame.mobile { width: 375px; max-width: 100%; }

        .empty-preview {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            padding: 40px 20px;
            text-align: center;
        }
        .empty-preview .icon { width: 48px; height: 48px; opacity: 0.4; }
        .empty-preview h3 { color: var(--text-primary); font-size: 16px; font-weight: 600; }
        .empty-preview p { font-size: 13px; }

        /* =========================================================
           TOAST  fully hidden when idle
           ========================================================= */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--success);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 340px;
            z-index: 1000;

            /* Hidden by default  fully off-screen & invisible */
            transform: translateY(calc(100% + 40px));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease,
                visibility 0.3s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (max-width: 900px) {
            .controls-panel {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .controls-panel.open { transform: translateX(0); }
            .preview-toolbar { padding-right: 16px; }
        }
    </style>
    <link rel="stylesheet" href="/dashboard/css/shared.css">
    <link rel="stylesheet" href="/dashboard/css/mobile.css?v=639253230792239530">
    <link rel="stylesheet" href="/dashboard/css/loader.css?v=639253230792239530">
</head>
<body>

    <!-- =========================================================
         LEFT  CONTROLS PANEL
         ========================================================= -->
    <aside class="controls-panel" id="controlsPanel">

        <div class="panel-header">
            <div class="panel-header-left">
                <a href="/dashboard/pages/portfolio.html" class="back-btn" title="Back to Portfolio Settings">
                    <i data-lucide="arrow-left" class="icon"></i>
                </a>
                <h1>Edit Portfolio</h1>
            </div>
            <div class="panel-header-right">
                <a href="/dashboard/" class="back-btn" title="Back to Dashboard">
                    <i data-lucide="layout-dashboard" class="icon"></i>
                </a>
                <a href="/dashboard/pages/portfolio.html" class="back-btn" title="Portfolio Settings">
                    <i data-lucide="settings" class="icon"></i>
                </a>
            </div>
        </div>

        <div class="panel-body">

            <!-- HERO CONTENT -->
            <div class="control-group">
                <div class="control-group-header" data-toggle="hero">
                    <h3><i data-lucide="sparkles" class="icon"></i> Hero Section</h3>
                    <i data-lucide="chevron-down" class="icon chevron open"></i>
                </div>
                <div class="control-group-body open" data-group="hero">
                    <div class="form-group">
                        <label>Name / Title</label>
                        <input type="text" id="heroTitle" placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label>Tagline</label>
                        <input type="text" id="heroTagline" placeholder="What you do">
                    </div>
                    <div class="form-group">
                        <label>Hero Image URL</label>
                        <input type="text" id="heroImage" placeholder="/uploads/profiles/...">
                    </div>
                </div>
            </div>

            <!-- SECTIONS -->
            <div class="control-group">
                <div class="control-group-header" data-toggle="sections">
                    <h3><i data-lucide="layout" class="icon"></i> Sections</h3>
                    <i data-lucide="chevron-down" class="icon chevron open"></i>
                </div>
                <div class="control-group-body open" data-group="sections">
                    <div id="orderList">
                        <div class="order-item" draggable="true" data-section="about">
                            <i data-lucide="grip-vertical" class="icon drag-handle"></i>
                            <i data-lucide="user" class="icon"></i>
                            <span class="label">About</span>
                            <label class="toggle-small">
                                <input type="checkbox" data-visible="about" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="order-item" draggable="true" data-section="projects">
                            <i data-lucide="grip-vertical" class="icon drag-handle"></i>
                            <i data-lucide="folder-open" class="icon"></i>
                            <span class="label">Projects</span>
                            <label class="toggle-small">
                                <input type="checkbox" data-visible="projects" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="order-item" draggable="true" data-section="services">
                            <i data-lucide="grip-vertical" class="icon drag-handle"></i>
                            <i data-lucide="briefcase" class="icon"></i>
                            <span class="label">Services</span>
                            <label class="toggle-small">
                                <input type="checkbox" data-visible="services" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="order-item" draggable="true" data-section="skills">
                            <i data-lucide="grip-vertical" class="icon drag-handle"></i>
                            <i data-lucide="star" class="icon"></i>
                            <span class="label">Skills</span>
                            <label class="toggle-small">
                                <input type="checkbox" data-visible="skills" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="order-item" draggable="true" data-section="contact">
                            <i data-lucide="grip-vertical" class="icon drag-handle"></i>
                            <i data-lucide="mail" class="icon"></i>
                            <span class="label">Contact</span>
                            <label class="toggle-small">
                                <input type="checkbox" data-visible="contact" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="order-item" draggable="true" data-section="social">
                            <i data-lucide="grip-vertical" class="icon drag-handle"></i>
                            <i data-lucide="share-2" class="icon"></i>
                            <span class="label">Social Links</span>
                            <label class="toggle-small">
                                <input type="checkbox" data-visible="social" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STYLE -->
            <div class="control-group">
                <div class="control-group-header" data-toggle="style">
                    <h3><i data-lucide="palette" class="icon"></i> Style</h3>
                    <i data-lucide="chevron-down" class="icon chevron"></i>
                </div>
                <div class="control-group-body" data-group="style">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Primary</label>
                            <input type="color" id="primaryColor" value="#2563EB" style="height:36px; padding:3px; cursor:pointer;">
                        </div>
                        <div class="form-group">
                            <label>Background</label>
                            <input type="color" id="bgColor" value="#0F172A" style="height:36px; padding:3px; cursor:pointer;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Font</label>
                        <select id="fontFamily">
                            <option value="Inter">Inter</option>
                            <option value="Poppins">Poppins</option>
                            <option value="Playfair Display">Playfair Display</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Space Grotesk">Space Grotesk</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>

        <div class="panel-footer">
            <button class="btn-secondary" id="refreshBtn" title="Refresh preview">
                <i data-lucide="refresh-cw" class="icon" style="width:14px;height:14px;"></i>
            </button>
            <button class="btn-primary" id="saveBtn">
                <i data-lucide="save" class="icon" style="width:14px;height:14px;"></i>
                Save &amp; Refresh
            </button>
        </div>
    </aside>

    <!-- =========================================================
         RIGHT  PREVIEW AREA
         ========================================================= -->
    <main class="preview-area">

        <a href="/dashboard/" class="floating-back" title="Back to Dashboard">
            <i data-lucide="arrow-left" class="icon"></i>
            Dashboard
        </a>

        <div class="preview-toolbar">
            <div class="preview-url">
                <i data-lucide="globe" class="icon"></i>
                <span id="previewUrlText">Loading...</span>
            </div>
            <div class="device-switcher">
                <button class="active" data-device="desktop" title="Desktop">
                    <i data-lucide="monitor" class="icon"></i>
                </button>
                <button data-device="tablet" title="Tablet">
                    <i data-lucide="tablet" class="icon"></i>
                </button>
                <button data-device="mobile" title="Smartphone">
                    <i data-lucide="smartphone" class="icon"></i>
                </button>
            </div>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="empty-preview">
                <i data-lucide="loader" class="icon"></i>
                <p>Loading preview...</p>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/dashboard/js/portfolio-edit.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
    <script src="/dashboard/js/mobile-menu.js?v=639252892257462073"></script>
    <script src="/dashboard/js/loader.js?v=639253230792239530"></script>
</body>
</html>
