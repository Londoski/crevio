<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Crevio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Cropper.js for cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <style>
        /* ---- RESET & BASE ---- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            display: flex;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        /* ---- THEME VARIABLES ---- */
        [data-theme="dark"] {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-card: #1E293B;
            --bg-input: #0F172A;
            --border-color: #334155;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --accent-dim: rgba(37,99,235,0.15);
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --success: #22C55E;
            --warning: #F59E0B;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        [data-theme="light"] {
            --bg-primary: #F1F5F9;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-input: #F8FAFC;
            --border-color: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --accent-dim: rgba(37,99,235,0.1);
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --success: #22C55E;
            --warning: #F59E0B;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        /* ---- SIDEBAR (unchanged) ---- */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
            overflow-y: auto;
        }
        .sidebar-brand { padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .sidebar-brand h1 { font-size: 20px; font-weight: 700; color: var(--text-primary); }
        .sidebar-brand span { font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--text-muted); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
            color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: all 0.15s;
            text-decoration: none;
        }
        .nav-item:hover { background: var(--accent-dim); color: var(--text-primary); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); }
        .nav-item .icon { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-divider { height: 1px; background: var(--border-color); margin: 8px 12px; }
        .sidebar-footer { padding-top: 16px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        .logout-button {
            background: transparent; border: none; color: var(--danger); font-size: 13px; font-weight: 500;
            padding: 10px 12px; border-radius: 8px; cursor: pointer; font-family: inherit;
            display: flex; align-items: center; gap: 12px; transition: background 0.15s;
            width: 100%;
        }
        .logout-button:hover { background: rgba(239,68,68,0.1); }

        .theme-toggle-btn {
            background: transparent; border: none; color: var(--text-secondary); font-size: 18px;
            cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: background 0.15s;
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
        }
        .theme-toggle-btn:hover { background: var(--accent-dim); color: var(--text-primary); }
        .theme-toggle-btn .icon { width: 18px; height: 18px; }

        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        .sidebar-overlay.open { display: block; }

        /* ---- MAIN ---- */
        .dashboard-main {
            flex: 1; padding: 28px 36px; background: var(--bg-primary);
            min-height: 100vh; transition: background 0.3s;
        }

        /* ---- HEADER ---- */
        .dashboard-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
        }
        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .mobile-menu-toggle { display: none; background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }
        .topbar-left h2 { font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .header-description { font-size: 14px; color: var(--text-secondary); }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .primary-button {
            padding: 8px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff;
            font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.15s; text-decoration: none;
        }
        .primary-button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .secondary-button {
            padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border-color);
            background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.15s; text-decoration: none;
        }
        .secondary-button:hover { background: var(--bg-card); color: var(--text-primary); }
        .user-profile { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .user-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }

        /* ---- PROFILE PICTURE CARD (compact, centered) ---- */
        .profile-card {
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 32px;
            transition: background 0.3s, border-color 0.3s;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .profile-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .profile-card h3 .icon {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }

        /* Profile picture container */
        .profile-picture-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 0;
        }

        .profile-picture-wrapper {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            overflow: hidden;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .profile-picture-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-picture-wrapper .initials {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Buttons stacked vertically */
        .profile-picture-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
            margin-top: 4px;
        }

        .profile-picture-actions .btn {
            min-width: 160px;
            justify-content: center;
            border-radius: 10px !important;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-radius: 10px !important;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--danger) !important;
            color: #fff !important;
            border-radius: 10px !important;
        }
        .btn-danger:hover {
            background: var(--danger-hover) !important;
            transform: translateY(-1px);
        }

        /* Crop preview area */
        .crop-container {
            max-width: 400px;
            max-height: 400px;
            margin: 16px auto;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .crop-container img {
            display: block;
            max-width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .message.success { display: block; background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
        .message.error { display: block; background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .dashboard-main { padding: 16px 20px; }
            .mobile-menu-toggle { display: block; }
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .topbar-right { width: 100%; justify-content: space-between; }
            .user-name { display: none; }
            .profile-card { padding: 20px; max-width: 100%; }
            .profile-picture-wrapper { width: 120px; height: 120px; }
            .profile-picture-wrapper .initials { font-size: 36px; }
            .profile-picture-actions .btn { min-width: 140px; }
        }
        @media (max-width: 480px) {
            .profile-card { padding: 16px; }
            .profile-picture-actions .btn { min-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><h1>Crevio</h1><span>Creator Dashboard</span></div>
        <nav class="sidebar-nav">
            <a href="/dashboard/" class="nav-item"><i data-lucide="layout-dashboard" class="icon"></i> Overview</a>
            <a href="/dashboard/pages/projects.html" class="nav-item"><i data-lucide="folder-open" class="icon"></i> Projects</a>
            <a href="/dashboard/pages/media.html" class="nav-item"><i data-lucide="image" class="icon"></i> Media</a>
            <a href="/dashboard/pages/services.html" class="nav-item"><i data-lucide="briefcase" class="icon"></i> Services</a>
            <a href="/dashboard/pages/skills.html" class="nav-item"><i data-lucide="star" class="icon"></i> Skills</a>
            <a href="/dashboard/pages/social-links.html" class="nav-item"><i data-lucide="share-2" class="icon"></i> My Socials</a>
            <div class="nav-divider"></div>
            <a href="/dashboard/pages/portfolio.html" class="nav-item"><i data-lucide="layout-template" class="icon"></i> Portfolio</a>
            <a href="/dashboard/pages/portfolio-edit.html" class="nav-item"><i data-lucide="edit-3" class="icon"></i> Edit Portfolio</a>
            <a href="/dashboard/pages/bot.html" class="nav-item"><i data-lucide="bot" class="icon"></i> Crevio Bot</a>
            <div class="nav-divider"></div>
            <a href="/dashboard/pages/messages.html" class="nav-item"><i data-lucide="mail" class="icon"></i> Messages</a>
            <a href="/dashboard/pages/notifications.html" class="nav-item"><i data-lucide="bell" class="icon"></i> Notifications</a>
            <div class="nav-divider"></div>
            <a href="/dashboard/pages/billing.html" class="nav-item"><i data-lucide="credit-card" class="icon"></i> Billing</a>
            <a href="/dashboard/pages/security.html" class="nav-item"><i data-lucide="shield" class="icon"></i> Security</a>
            <a href="/dashboard/pages/settings.html" class="nav-item"><i data-lucide="settings" class="icon"></i> Settings</a>
            <a href="/dashboard/pages/profile.html" class="nav-item active"><i data-lucide="user" class="icon"></i> Profile</a>
            <a href="/dashboard/pages/account-management.html" class="nav-item"><i data-lucide="user-cog" class="icon"></i> Account Management</a>
            <div class="nav-divider"></div>
            <a href="/" target="_blank" class="nav-item"><i data-lucide="globe" class="icon"></i> View Portfolio</a>
        </nav>
        <div class="sidebar-footer">
            <span id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--text-secondary);font-size:18px;">
                <i data-lucide="moon" class="icon"></i>
            </span>
            <button id="logoutButton" class="logout-button"><i data-lucide="log-out" class="icon"></i> Logout</button>
        </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- MAIN -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div class="topbar-left">
                <button id="mobileToggle" class="mobile-menu-toggle"><i data-lucide="menu"></i></button>
                <div>
                    <h2>Profile</h2>
                    <p class="header-description">Manage your professional profile</p>
                </div>
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <span class="user-avatar" id="userAvatar">C</span>
                    <span class="user-name" id="userNameDisplay">Creator</span>
                </div>
            </div>
        </header>

        <!-- PROFILE PICTURE CARD (compact) -->
        <div class="profile-card">
            <h3><i data-lucide="camera" class="icon"></i> Profile Picture</h3>
            <div id="profilePictureContainer" class="profile-picture-container">

                <!-- Current Profile Picture -->
                <div class="profile-picture-wrapper" id="profilePictureWrapper">
                    <img id="profileImagePreview" src="" alt="Profile Picture" style="display:none;">
                    <span id="profileInitials" class="initials">JD</span>
                </div>

                <!-- Actions (stacked) -->
                <div class="profile-picture-actions">
                    <button class="btn btn-primary" id="uploadBtn">
                        <i data-lucide="upload" class="icon"></i> Change Photo
                    </button>
                    <button class="btn btn-danger" id="removeBtn">
                        <i data-lucide="trash-2" class="icon"></i> Remove
                    </button>
                </div>

                <!-- Hidden file input -->
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">

                <!-- Preview & Crop Area -->
                <div id="previewArea" class="hidden" style="width:100%;">
                    <div class="crop-container">
                        <img id="cropImage" src="" alt="Crop preview">
                    </div>
                    <div style="display:flex; gap:12px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
                        <button class="btn btn-primary" id="saveCropBtn">Save</button>
                        <button class="btn btn-secondary" id="cancelCropBtn">Cancel</button>
                    </div>
                </div>

                <!-- Message -->
                <div id="profileMessage" class="message"></div>
            </div>
        </div>

    </main>

    <script src="/dashboard/js/profile.js"></script>
    <script src="/dashboard/js/avatar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        document.getElementById('mobileToggle')?.addEventListener('click', function() {
            document.getElementById('sidebar')?.classList.toggle('open');
            document.getElementById('sidebarOverlay')?.classList.toggle('open');
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', function() {
            document.getElementById('sidebar')?.classList.remove('open');
            this.classList.remove('open');
        });
        document.getElementById('logoutButton')?.addEventListener('click', function() {
            localStorage.removeItem('crevio_token');
            localStorage.removeItem('crevio_user');
            window.location.href = '/admin/pages/login.html';
        });

        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('crevio_theme', next);
            var icon = document.querySelector('#themeToggleBtn .icon');
            if (icon) {
                icon.setAttribute('data-lucide', next === 'dark' ? 'moon' : 'sun');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }
        window.toggleTheme = toggleTheme;
    </script>
</body>
</html>
