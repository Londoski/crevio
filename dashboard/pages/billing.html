<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing — Crevio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Copy the exact same styles from projects.html */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        a { text-decoration: none; color: inherit; }
        [data-theme="dark"] { --bg-primary:#0F172A; --bg-secondary:#1E293B; --bg-card:#1E293B; --bg-input:#0F172A; --border-color:#334155; --text-primary:#F1F5F9; --text-secondary:#94A3B8; --text-muted:#64748B; --accent:#2563EB; --accent-hover:#1D4ED8; --accent-dim:rgba(37,99,235,0.15); --danger:#EF4444; --danger-hover:#DC2626; --success:#22C55E; --warning:#F59E0B; }
        [data-theme="light"] { --bg-primary:#F1F5F9; --bg-secondary:#FFFFFF; --bg-card:#FFFFFF; --bg-input:#F8FAFC; --border-color:#E2E8F0; --text-primary:#0F172A; --text-secondary:#475569; --text-muted:#94A3B8; --accent:#2563EB; --accent-hover:#1D4ED8; --accent-dim:rgba(37,99,235,0.1); --danger:#EF4444; --danger-hover:#DC2626; --success:#22C55E; --warning:#F59E0B; }
        .sidebar { width:240px; background:var(--bg-secondary); border-right:1px solid var(--border-color); display:flex; flex-direction:column; padding:24px 16px; height:100vh; position:sticky; top:0; flex-shrink:0; transition:background 0.3s,border-color 0.3s; overflow-y:auto; }
        .sidebar-brand { padding-bottom:20px; border-bottom:1px solid var(--border-color); margin-bottom:20px; }
        .sidebar-brand h1 { font-size:20px; font-weight:700; color:var(--text-primary); }
        .sidebar-brand span { font-size:11px; font-weight:500; text-transform:uppercase; color:var(--text-muted); }
        .sidebar-nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; color:var(--text-secondary); font-size:14px; font-weight:500; transition:all 0.15s; text-decoration:none; }
        .nav-item:hover { background:var(--accent-dim); color:var(--text-primary); }
        .nav-item.active { background:var(--accent-dim); color:var(--accent); }
        .nav-item .icon { width:20px; height:20px; flex-shrink:0; }
        .nav-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        .sidebar-footer { padding-top:16px; border-top:1px solid var(--border-color); display:flex; flex-direction:column; gap:8px; }
        .logout-button { background:transparent; border:none; color:var(--danger); font-size:13px; font-weight:500; padding:10px 12px; border-radius:8px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:12px; transition:background 0.15s; width:100%; }
        .logout-button:hover { background:rgba(239,68,68,0.1); }
        .theme-toggle-btn { background:transparent; border:none; color:var(--text-secondary); font-size:18px; cursor:pointer; padding:6px 10px; border-radius:8px; transition:background 0.15s; display:inline-flex; align-items:center; gap:6px; width:fit-content; }
        .theme-toggle-btn:hover { background:var(--accent-dim); color:var(--text-primary); }
        .theme-toggle-btn .icon { width:18px; height:18px; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:199; }
        .sidebar-overlay.open { display:block; }
        .dashboard-main { flex:1; padding:28px 36px; background:var(--bg-primary); min-height:100vh; transition:background 0.3s; }
        .dashboard-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
        .topbar-left { display:flex; align-items:center; gap:16px; }
        .mobile-menu-toggle { display:none; background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer; }
        .topbar-left h2 { font-size:24px; font-weight:700; color:var(--text-primary); }
        .header-description { font-size:14px; color:var(--text-secondary); }
        .topbar-right { display:flex; align-items:center; gap:16px; }
        .primary-button { padding:8px 18px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all 0.15s; text-decoration:none; }
        .primary-button:hover { background:var(--accent-hover); transform:translateY(-1px); }
        .user-profile { display:flex; align-items:center; gap:8px; }
        .user-avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; }
        .user-name { font-size:14px; font-weight:500; color:var(--text-primary); }
        .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:24px; margin-bottom:24px; }
        .billing-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
        .plan-card .plan-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
        .plan-card .plan-name { font-size:20px; font-weight:700; color:var(--text-primary); }
        .plan-card .plan-price { font-size:24px; font-weight:700; color:var(--accent); }
        .plan-card .plan-price span { font-size:14px; font-weight:400; color:var(--text-muted); }
        .plan-card .plan-status { display:inline-block; padding:4px 14px; border-radius:999px; font-size:12px; font-weight:600; text-transform:uppercase; }
        .plan-status.active { background:rgba(34,197,94,0.15); color:var(--success); }
        .plan-status.canceled { background:rgba(239,68,68,0.15); color:var(--danger); }
        .plan-status.past_due { background:rgba(245,158,11,0.15); color:var(--warning); }
        .plan-actions { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
        .btn { padding:10px 20px; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:6px; border:none; font-family:inherit; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:var(--accent-hover); transform:translateY(-1px); }
        .btn-secondary { background:transparent; border:1px solid var(--border-color); color:var(--text-secondary); }
        .btn-secondary:hover { background:var(--bg-card); color:var(--text-primary); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-danger:hover { background:var(--danger-hover); }
        .usage-item { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-color); font-size:14px; }
        .usage-item:last-child { border-bottom:none; }
        .usage-item .label { color:var(--text-secondary); }
        .usage-item .value { font-weight:500; color:var(--text-primary); }
        .usage-item .max { color:var(--text-muted); font-size:13px; }
        .usage-bar { height:6px; background:var(--border-color); border-radius:999px; overflow:hidden; margin-top:4px; }
        .usage-bar .fill { height:100%; border-radius:999px; transition:width 0.4s; }
        .usage-bar .fill.good { background:var(--success); }
        .usage-bar .fill.warning { background:var(--warning); }
        .usage-bar .fill.danger { background:var(--danger); }
        .features-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .feature-item { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-secondary); padding:4px 0; }
        .feature-item .check { color:var(--success); }
        .feature-item .cross { color:var(--text-muted); }
        .payment-table { width:100%; border-collapse:collapse; font-size:14px; }
        .payment-table th { text-align:left; padding:10px 12px; color:var(--text-muted); font-weight:500; font-size:12px; text-transform:uppercase; border-bottom:1px solid var(--border-color); }
        .payment-table td { padding:10px 12px; border-bottom:1px solid var(--border-color); color:var(--text-secondary); }
        .payment-table .status-paid { color:var(--success); }
        .payment-table .status-pending { color:var(--warning); }
        .payment-table .status-failed { color:var(--danger); }
        .loading-state { padding:40px 0; text-align:center; color:var(--text-muted); font-size:14px; }
        @media (max-width:1024px) { .billing-grid { grid-template-columns:1fr; } }
        @media (max-width:768px) {
            .sidebar { display:none; }
            .dashboard-main { padding:16px 20px; }
            .mobile-menu-toggle { display:block; }
            .dashboard-header { flex-direction:column; align-items:flex-start; gap:12px; }
            .topbar-right { width:100%; justify-content:space-between; }
            .user-name { display:none; }
            .features-grid { grid-template-columns:1fr; }
            .plan-actions { flex-direction:column; align-items:stretch; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><h1>Crevio</h1><span>Creator Dashboard</span></div>
        <nav class="sidebar-nav">
            <a href="/dashboard/" class="nav-item"><i data-lucide="layout-dashboard" class="icon"></i> Overview</a>
            <a href="/dashboard/pages/projects.html" class="nav-item"><i data-lucide="folder-open" class="icon"></i> Projects</a>
            <a href="/dashboard/pages/media.html" class="nav-item"><i data-lucide="image" class="icon"></i> Media</a>
            <a href="/dashboard/pages/services.html" class="nav-item"><i data-lucide="briefcase" class="icon"></i> Services</a>
            <a href="/dashboard/pages/skills.html" class="nav-item"><i data-lucide="star" class="icon"></i> Skills</a>
            <a href="/dashboard/pages/social-links.html" class="nav-item"><i data-lucide="share-2" class="icon"></i> My Socials</a>
            <div class="nav-divider"></div>
            <a href="/dashboard/pages/portfolio.html" class="nav-item"><i data-lucide="layout-template" class="icon"></i> Portfolio</a>
            <a href="/dashboard/pages/bot.html" class="nav-item"><i data-lucide="bot" class="icon"></i> Crevio Bot</a>
            <div class="nav-divider"></div>
            <a href="/dashboard/pages/messages.html" class="nav-item"><i data-lucide="mail" class="icon"></i> Messages</a>
            <a href="/dashboard/pages/notifications.html" class="nav-item"><i data-lucide="bell" class="icon"></i> Notifications</a>
            <div class="nav-divider"></div>
            <a href="/dashboard/pages/billing.html" class="nav-item active"><i data-lucide="credit-card" class="icon"></i> Billing</a>
            <a href="/dashboard/pages/security.html" class="nav-item"><i data-lucide="shield" class="icon"></i> Security</a>
            <a href="/dashboard/pages/settings.html" class="nav-item"><i data-lucide="settings" class="icon"></i> Settings</a>
            <a href="/dashboard/pages/profile.html" class="nav-item"><i data-lucide="user" class="icon"></i> Profile</a>
            <a href="/dashboard/pages/account-management.html" class="nav-item"><i data-lucide="user-cog" class="icon"></i> Account Management</a>
            <div class="nav-divider"></div>
            <a href="/" target="_blank" class="nav-item"><i data-lucide="globe" class="icon"></i> View Portfolio</a>
        </nav>
        <div class="sidebar-footer">
            <span id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--text-secondary);font-size:18px;">
                <i data-lucide="moon" class="icon"></i>
            </span>
            <button id="logoutButton" class="logout-button"><i data-lucide="log-out" class="icon"></i> Logout</button>
        </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- MAIN -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div class="topbar-left">
                <button id="mobileToggle" class="mobile-menu-toggle"><i data-lucide="menu"></i></button>
                <div>
                    <h2>Billing</h2>
                    <p class="header-description">Manage your subscription and payment details</p>
                </div>
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <span class="user-avatar" id="userAvatar">C</span>
                    <span class="user-name" id="userNameDisplay">Creator</span>
                </div>
            </div>
        </header>

        <div id="billingContainer">
            <div class="loading-state">Loading billing information...</div>
        </div>

    </main>

    <script src="/dashboard/js/billing.js"></script>
    <script src="/dashboard/js/theme.js"></script>
    <script src="/dashboard/js/avatar.js"></script>
    <script>
        document.getElementById('mobileToggle')?.addEventListener('click', function() {
            document.getElementById('sidebar')?.classList.toggle('open');
            document.getElementById('sidebarOverlay')?.classList.toggle('open');
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', function() {
            document.getElementById('sidebar')?.classList.remove('open');
            this.classList.remove('open');
        });
        document.getElementById('logoutButton')?.addEventListener('click', function() {
            localStorage.removeItem('crevio_token');
            localStorage.removeItem('crevio_user');
            window.location.href = '/admin/pages/login.html';
        });
    </script>
</body>
</html>
